<style>
:root{--bg:#f3f4f8;--surface:#fff;--surface2:#f7f8fb;--ink:#14171f;--muted:#667085;--line:#e4e7ee;--brand:#2b45b8;--brand2:#4a63d8;--brandSoft:#e9edfc;--ok:#0f8a5f;--okSoft:#e1f5ec;--bad:#c2372f;--badSoft:#fbe9e7;--flag:#c26a04;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.05);--r:16px}
:root[data-theme="dark"]{--bg:#0d0f14;--surface:#161a22;--surface2:#1c212b;--ink:#eceef4;--muted:#9aa3b5;--line:#262c38;--brand:#8ea2ff;--brand2:#a9b8ff;--brandSoft:#1d2442;--ok:#3fcf8e;--okSoft:#10302a;--bad:#ff7a70;--badSoft:#3a1b1a;--flag:#f5a524;--shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:22px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#6d4bd8);color:white;display:grid;place-items:center;font:700 19px Fraunces,serif}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.toplinks{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 13px;font-weight:700;font-size:13px;text-decoration:none}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.hero{background:linear-gradient(120deg,var(--surface),var(--brandSoft));border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:20px}.eyebrow{color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font:700 clamp(28px,4vw,42px)/1.12 Fraunces,serif;margin:8px 0}.hero p{color:var(--muted);max-width:780px;margin:8px 0 0}.switch{display:flex;gap:8px;margin:0 0 18px}.switch button{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 17px;font-weight:800}.switch button.on{background:var(--brand);color:#fff;border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 7px}.card p{margin:5px 0;color:var(--muted)}.metric{font:700 30px Fraunces,serif}.muted{color:var(--muted)}.bar{height:7px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ok)}.paperhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 12px}.paperhead h2{font:700 25px Fraunces,serif;margin:0}.practice-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}.question{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);min-width:0}.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin-bottom:12px}.pill{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-weight:700}.question h2{font:700 23px/1.2 Fraunces,serif;margin:0 0 14px}.scenario{background:var(--brandSoft);border-left:4px solid var(--brand);padding:13px 15px;border-radius:10px;margin-bottom:16px;white-space:pre-wrap}.prompt{white-space:pre-wrap;line-height:1.65}.options{display:grid;gap:9px;margin:17px 0}.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2)}.opt:hover{border-color:var(--brand)}.opt.selected{border-color:var(--brand);background:var(--brandSoft)}.opt.correct{border-color:var(--ok);background:var(--okSoft)}.opt.wrong{border-color:var(--bad);background:var(--badSoft)}.opt b{flex:none}.answerbox{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);padding:12px;resize:vertical}.answerbox:focus{outline:2px solid var(--brand);border-color:var(--brand)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.feedback{margin-top:16px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}.feedback.good{background:var(--okSoft);border-color:var(--ok)}.feedback.bad{background:var(--badSoft);border-color:var(--bad)}.model{white-space:pre-wrap;max-height:440px;overflow:auto;margin-top:10px;padding:13px;border-radius:10px;background:var(--surface2);font-size:13.5px}.side{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;position:sticky;top:12px}.side h3{margin:0 0 10px}.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.navgrid button{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:8px 2px;font-weight:800;font-size:12px}.navgrid button.current{outline:2px solid var(--brand)}.navgrid button.done{background:var(--okSoft);border-color:var(--ok)}.navgrid button.flag{box-shadow:inset 0 -3px var(--flag)}.side .legend{font-size:11px;color:var(--muted);margin-top:12px}.footnote{font-size:12px;color:var(--muted);margin-top:18px}.notice{background:#fff7e8;border:1px solid #efd6a6;color:#765018;padding:12px 14px;border-radius:12px;margin:15px 0;font-size:13px}:root[data-theme="dark"] .notice{background:#302713;color:#f2d69d;border-color:#5c4820}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--surface)}.timer{font-weight:800;color:var(--bad)}.hide{display:none!important}.empty{text-align:center;padding:38px;color:var(--muted)}@media(max-width:850px){.practice-layout{grid-template-columns:1fr}.side{position:static;order:-1}.navgrid{grid-template-columns:repeat(10,1fr)}}@media(max-width:520px){.shell{padding:14px}.hero{padding:19px}.question{padding:16px}.top{align-items:flex-start}.toplinks{justify-content:flex-end}.navgrid{grid-template-columns:repeat(6,1fr)}}
</style>

<body data-subject="FR"><main class="shell">
<header class="top"><div class="brand"><div class="mark">Y</div><div>Yates Education<small>ACCA student practice</small></div></div><div class="toplinks"><a class="btn" href="index.html">← Audit & Assurance</a><button class="btn" id="themeBtn">☾ Theme</button><button class="btn" id="loginBtn">Sign in for cloud sync</button></div></header>
<div id="app"><div class="empty">Loading FR and PM question banks…</div></div>
</main>
<script>
const BANKS={FR:null,PM:null};
async function loadBanks(){for(const s of ['FR','PM']){const r=await fetch(`data/question-banks/${s.toLowerCase()}.json`);if(!r.ok)throw new Error(`Could not load ${s} question bank`);BANKS[s]=await r.json();}}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORAGE='yates-subject-practice-v1';let subject='FR',paper=null,index=0,mode='practice',showModel=false,selected=null,answerDraft='',firebase=null;
function freshState(){return {updatedAt:Date.now(),FR:{attempts:{},bookmarks:{},responses:{}},PM:{attempts:{},bookmarks:{},responses:{}}}}
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||freshState()}catch{state=freshState()}
let requestedSubject=new URLSearchParams(location.search).get('subject');try{requestedSubject=requestedSubject||JSON.parse(localStorage.getItem('yates-student-session-v1')||'{}').subject}catch{}if(['FR','PM'].includes(requestedSubject))subject=requestedSubject;document.body.dataset.subject=subject;
window.addEventListener('yates-subject-change',e=>{if(['FR','PM'].includes(e.detail?.subject)){subject=e.detail.subject;document.body.dataset.subject=subject;appHome();if(firebase?.user)loadCloud().catch(console.warn)}});
let cloudTimer=null;function save(){state.updatedAt=Date.now();try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){};if(firebase?.user){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>syncCloud().catch(e=>console.warn('Cloud sync pending',e)),800)}}
const qs=()=>BANKS[subject].questions.filter(q=>!paper||q.paper===paper);
function papers(){return [...new Set(BANKS[subject].questions.map(q=>q.paper))]}
function statFor(list){const s=state[subject],done=list.filter(q=>s.attempts[q.id]);const marked=done.filter(q=>s.attempts[q.id].correct===true||s.attempts[q.id].correct===false);const right=marked.filter(q=>s.attempts[q.id].correct===true).length;return {done:done.length,total:list.length,right,accuracy:marked.length?Math.round(right/marked.length*100):null,bookmarks:list.filter(q=>s.bookmarks[q.id]).length}}
function appHome(){paper=null;const all=BANKS[subject].questions,st=statFor(all);$('app').innerHTML=`<section class="hero"><div class="eyebrow">ACCA Applied Skills · ${subject==='FR'?'Financial Reporting':'Performance Management'}</div><h1>${subject==='FR'?'Financial Reporting (F7)':'Performance Management (F5)'}</h1><p>Question-by-question practice, answer review, bookmarks and independent progress tracking. Choose a supplied mock or test to begin.</p><div class="notice">The paper sets are transcribed from your supplied materials. Each subject also includes 10 original supplementary practice questions, clearly separated from past-paper content. Academic verification of transcriptions and answer keys is still pending. PM Mock D has no matching answer PDF in the supplied files.</div></section><div class="switch"><button class="${subject==='FR'?'on':''}" data-sub="FR">F7 · Financial Reporting</button><button class="${subject==='PM'?'on':''}" data-sub="PM">F5 · Performance Management</button></div><div class="grid"><article class="card"><div class="eyebrow">YOUR PROGRESS</div><div class="metric">${st.done} / ${st.total}</div><p>Questions attempted</p><div class="bar"><i style="width:${st.total?st.done/st.total*100:0}%"></i></div><p>${st.accuracy==null?'—':st.accuracy+'%'} accuracy on automatically marked answers · ${st.bookmarks} bookmarks</p></article><article class="card"><div class="eyebrow">QUESTION BANK</div><div class="metric">${all.length}</div><p>Extracted question records across ${papers().length} papers</p><p class="muted">Section A, Section B and Section C where supplied</p></article><article class="card"><div class="eyebrow">STUDY TOOLS</div><h3>Continue learning</h3><p>Review saved answers, revisit bookmarks and track progress independently for FR and PM.</p><button class="btn" id="bookmarksBtn">Open bookmarked questions</button></article></div><div class="paperhead"><h2>Choose a paper</h2><span class="muted">${papers().length} papers available</span></div><div class="grid">${papers().map(p=>{const list=all.filter(q=>q.paper===p),ps=statFor(list);return `<article class="card"><div class="eyebrow">${esc(subject)} · ${list.length} QUESTIONS</div><h3>${esc(p)}</h3><p>${list.filter(q=>q.section==='A').length} Section A · ${list.filter(q=>q.section==='B').length} Section B · ${list.filter(q=>q.section==='C').length} Section C</p><div class="bar"><i style="width:${ps.total?ps.done/ps.total*100:0}%"></i></div><p>${ps.done}/${ps.total} attempted · ${ps.bookmarks} bookmarked</p><div class="actions"><button class="btn primary" data-paper="${esc(p)}">Practise paper →</button><button class="btn" data-exam="${esc(p)}">Timed mock</button></div></article>`}).join('')}</div><p class="footnote">Your FR and PM progress is stored separately in this browser. Sign in to synchronise to your Firebase account on supported deployments.</p>`;}
function startPaper(p,exam=false){paper=p;mode=exam?'exam':'practice';index=0;showModel=false;selected=null;answerDraft='';const list=qs();if(exam){const key=`examEnd-${subject}-${paper}`;let end=Number(sessionStorage.getItem(key));if(!end||end<Date.now()) {end=Date.now()+195*60000;sessionStorage.setItem(key,String(end));}state.examEnd=end;}drawQuestion();}
function current(){return qs()[index]}
function drawQuestion(){const list=qs(),q=current();if(!q){appHome();return}const st=state[subject],attempt=st.attempts[q.id],saved=st.responses[q.id]||{};if(selected===null&&saved.option)selected=saved.option;if(!answerDraft&&saved.text)answerDraft=saved.text;const answered=!!attempt;const optHtml=q.options.length?q.options.map(o=>`<button class="opt ${selected===o.key?'selected':''} ${answered&&q.correctOption===o.key?'correct':''} ${answered&&selected===o.key&&q.correctOption&&selected!==q.correctOption?'wrong':''}" data-opt="${o.key}" ${answered?'disabled':''}><b>${o.key}.</b><span>${esc(o.text)}</span></button>`).join(''):`<textarea class="answerbox" id="answerDraft" placeholder="Write your answer here…" ${answered?'disabled':''}>${esc(answerDraft)}</textarea>`;const canMark=!!q.correctOption&&!!selected;const answerStatus=answered?(attempt.correct===true?'Correct':attempt.correct===false?'Not correct':'Response saved'):'Not attempted';const modelAvailable=q.answerAvailable&&q.modelAnswer;
$('app').innerHTML=`<div class="paperhead"><div><button class="btn" id="backPapers">← All papers</button><h2 style="margin-top:10px">${esc(paper)}</h2><div class="muted">${subject==='FR'?'Financial Reporting (F7)':'Performance Management (F5)'} · ${mode==='exam'?'<span class="timer" id="timer">Timed mock</span>':'Practice mode'}</div></div><div class="actions"><button class="btn" id="prevBtn" ${index===0?'disabled':''}>← Previous</button><button class="btn primary" id="nextBtn" ${index===list.length-1?'disabled':''}>Next →</button></div></div><div class="practice-layout"><section class="question"><div class="qmeta"><span class="pill">Section ${q.section}</span><span class="pill">Question ${q.number}</span><span class="pill">${q.marks?`${q.marks} marks`:'Constructed response'}</span><span class="pill">${index+1} of ${list.length}</span><span class="pill">${answerStatus}</span></div><h2>Question ${q.number}</h2>${q.scenarioContext?`<div class="scenario"><b>Scenario / exhibit</b><br>${esc(q.scenarioContext)}</div>`:''}<div class="prompt">${esc(q.prompt)}</div>${optHtml}<div class="actions">${!answered?`<button class="btn primary" id="submitBtn">${q.options.length?'Check answer':'Save response'}</button>`:`<span class="pill">Response saved</span>${mode==='practice'?'<button class="btn" id="retryBtn">Retry question</button>':''}`}<button class="btn" id="bookmarkBtn">${st.bookmarks[q.id]?'★ Bookmarked':'☆ Bookmark'}</button>${modelAvailable&&answered&&mode!=='exam'?`<button class="btn" id="modelBtn">${showModel?'Hide':'Show'} model answer</button>`:`<span class="muted" style="font-size:12px">${q.answerAvailable?'Answer text supplied':'No matching answer supplied'}</span>`}</div>${answered&&q.correctOption&&mode!=='exam'?`<div class="feedback ${attempt.correct?'good':'bad'}"><b>${attempt.correct?'Correct answer':'Review this answer'} · ${q.correctOption}</b>${attempt.correct?'':'<p>Compare your selection with the supplied answer key.</p>'}</div>`:''}${showModel&&modelAvailable?`<div class="feedback"><b>Supplied marking guide / answer</b><div class="model">${esc(q.modelAnswer)}</div></div>`:''}<div class="footnote">Source: ${esc(q.source.questionFile)} · ${q.answerAvailable?'Matching answer material supplied':'No matching answer material supplied'} · Verification: pending</div></section><aside class="side"><h3>Question navigator</h3><div class="navgrid">${list.map((x,i)=>`<button class="${i===index?'current':''} ${st.attempts[x.id]?'done':''} ${st.bookmarks[x.id]?'flag':''}" data-go="${i}" title="Question ${x.number}">${x.number}</button>`).join('')}</div><div class="legend">Green = attempted · Orange underline = bookmarked</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="muted" style="font-size:12px">Progress</div><b>${statFor(list).done} / ${list.length}</b><div class="bar"><i style="width:${statFor(list).done/list.length*100}%"></i></div><button class="btn" style="width:100%;margin-top:8px" id="finishBtn">Finish / review paper</button></aside></div>`;
$('backPapers').onclick=appHome;$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('bookmarkBtn').onclick=()=>{const b=st.bookmarks[q.id];if(b)delete st.bookmarks[q.id];else st.bookmarks[q.id]=Date.now();save();drawQuestion()};if($('modelBtn'))$('modelBtn').onclick=()=>{showModel=!showModel;drawQuestion()};if($('submitBtn'))$('submitBtn').onclick=submitAnswer;if($('retryBtn'))$('retryBtn').onclick=()=>{delete st.attempts[q.id];delete st.responses[q.id];selected=null;answerDraft='';showModel=false;save();drawQuestion()};if($('retryBtn'))$('retryBtn').onclick=()=>{delete st.attempts[q.id];delete st.responses[q.id];selected=null;answerDraft='';showModel=false;save();drawQuestion()};if($('finishBtn'))$('finishBtn').onclick=reviewPaper;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{selected=b.dataset.opt;st.responses[q.id]={...(st.responses[q.id]||{}),option:selected,at:Date.now()};save();drawQuestion()});if($('answerDraft'))$('answerDraft').oninput=e=>{answerDraft=e.target.value;st.responses[q.id]={...(st.responses[q.id]||{}),text:answerDraft,at:Date.now()};save()};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{index=+b.dataset.go;selected=null;answerDraft='';showModel=false;drawQuestion()});if(mode==='exam')tickTimer();}
function submitAnswer(){const q=current(),st=state[subject];let correct=null;if(q.correctOption&&selected)correct=selected===q.correctOption;st.attempts[q.id]={correct,option:selected,text:answerDraft,at:Date.now()};save();drawQuestion()}
function move(d){index=Math.max(0,Math.min(qs().length-1,index+d));selected=null;answerDraft='';showModel=false;drawQuestion()}
function reviewPaper(){mode='review';const list=qs(),st=state[subject];$('app').innerHTML=`<section class="hero"><div class="eyebrow">PAPER REVIEW</div><h1>${esc(paper)}</h1><p>${statFor(list).done} of ${list.length} questions attempted. Automatically marked correct answers: ${statFor(list).right}. Questions without an answer key are saved for manual review.</p><div class="actions"><button class="btn primary" id="resumeBtn">Return to questions</button><button class="btn" id="homeBtn">All papers</button></div></section><div class="grid">${list.map((q,i)=>{const a=st.attempts[q.id];return `<article class="card"><div class="eyebrow">SECTION ${q.section} · Q${q.number}</div><h3>${a?(a.correct===true?'Correct':a.correct===false?'Review':'Response saved'):'Not attempted'}</h3><p>${esc(q.prompt.slice(0,160))}${q.prompt.length>160?'…':''}</p><button class="btn" data-review="${i}">Review question</button></article>`}).join('')}</div>`;$('resumeBtn').onclick=()=>drawQuestion();$('homeBtn').onclick=appHome;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{index=+b.dataset.review;selected=null;answerDraft='';showModel=false;drawQuestion()})}
function appBookmarks(){const list=BANKS[subject].questions.filter(q=>state[subject].bookmarks[q.id]);$('app').innerHTML=`<div class="paperhead"><div><button class="btn" id="backHome">← Dashboard</button><h2 style="margin-top:10px">Bookmarked ${subject} questions</h2></div></div>${list.length?`<div class="grid">${list.map(q=>`<article class="card"><div class="eyebrow">${esc(q.paper)} · SECTION ${q.section}</div><h3>Question ${q.number}</h3><p>${esc(q.prompt.slice(0,180))}</p><button class="btn" data-open="${esc(q.id)}">Open question</button></article>`).join('')}</div>`:'<div class="empty">No bookmarks yet. Bookmark a question while practising.'}</div>`;$('backHome').onclick=appHome;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const q=BANKS[subject].questions.find(x=>x.id===b.dataset.open);paper=q.paper;index=qs().findIndex(x=>x.id===q.id);selected=null;answerDraft='';drawQuestion()})}
function tickTimer(){const el=$('timer');if(!el||mode!=='exam')return;const end=Number(sessionStorage.getItem(`examEnd-${subject}-${paper}`));const left=Math.max(0,end-Date.now());el.textContent=`Time remaining ${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;if(left<=0){mode='practice';reviewPaper();return}setTimeout(tickTimer,1000)}
$('app').addEventListener('click',e=>{const sub=e.target.closest('[data-sub]');if(sub){subject=sub.dataset.sub;document.body.dataset.subject=subject;window.dispatchEvent(new CustomEvent('yates-subject-change',{detail:{subject}}));appHome();if(firebase?.user)loadCloud().catch(e=>console.warn('Cloud load pending',e));return}const p=e.target.closest('[data-paper]');if(p){startPaper(p.dataset.paper);return}const ex=e.target.closest('[data-exam]');if(ex){startPaper(ex.dataset.exam,true);return}if(e.target.id==='bookmarksBtn')appBookmarks()});
$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';localStorage.setItem('yates-theme',dark?'dark':'light')};if(localStorage.getItem('yates-theme'))document.documentElement.dataset.theme=localStorage.getItem('yates-theme');

// Firebase account sync: subject progress is stored separately from AA in users/{uid}/subjectPractice/{FR|PM}.
const FIREBASE_CONFIG={apiKey:'AIzaSyDZVvHO_hlM51j2qTeGKfGLpH8t_YTSLDU',authDomain:'aa-exam-practice.firebaseapp.com',projectId:'aa-exam-practice',appId:'1:348006785291:web:621592fb02be5a24cf020e'};
async function connectFirebase(){const base='https://www.gstatic.com/firebasejs/10.14.1/';const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);const app=A.getApps().length?A.getApp():A.initializeApp(FIREBASE_CONFIG);const auth=Au.getAuth(app),db=F.getFirestore(app);firebase={A,Au,F,app,auth,db,user:null};Au.onAuthStateChanged(auth,async u=>{firebase.user=u;if(u){$('loginBtn').textContent=`Signed in · ${u.displayName||u.email}`;try{await loadCloud()}catch(e){console.warn('Cloud restore pending',e)}}else $('loginBtn').textContent='Sign in for cloud sync'});return firebase}
async function loadCloud(){if(!firebase?.user)return;const {F,db,user}=firebase;const ref=F.doc(db,'users',user.uid,'subjectPractice',subject);const snap=await F.getDoc(ref);if(snap.exists()){const cloud=snap.data().state||{};const local=state[subject]||{};const merge=(a,b)=>{const out={...(a||{})};for(const [k,v] of Object.entries(b||{})){const old=out[k];if(!old||Number(v?.at||v||0)>=Number(old?.at||old||0))out[k]=v;}return out};state[subject]={attempts:merge(cloud.attempts,local.attempts),bookmarks:merge(cloud.bookmarks,local.bookmarks),responses:merge(cloud.responses,local.responses)};saveLocalOnly();}await syncCloud();}
function saveLocalOnly(){state.updatedAt=Date.now();localStorage.setItem(STORAGE,JSON.stringify(state))}
async function syncCloud(){if(!firebase?.user)return;const {F,db,user}=firebase;const ref=F.doc(db,'users',user.uid,'subjectPractice',subject);await F.setDoc(ref,{uid:user.uid,subject,state:state[subject],updatedAt:F.serverTimestamp()},{merge:true})}
$('loginBtn').onclick=async()=>{try{if(!firebase)await connectFirebase();if(firebase.user){await firebase.Au.signOut(firebase.auth);return}await firebase.Au.signInWithPopup(firebase.auth,new firebase.Au.GoogleAuthProvider())}catch(e){alert('Sign-in or sync could not complete: '+e.message)}};
loadBanks().then(()=>{appHome();connectFirebase().catch(e=>{console.warn('Firebase not connected',e);$('loginBtn').textContent='Cloud sync unavailable'})}).catch(e=>{$('app').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
</script>
